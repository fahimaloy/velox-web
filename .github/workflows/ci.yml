name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run: a docs site gets many
# small commits in a row and testing every intermediate state wastes minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The static export is the deliverable, so the build is the primary gate.
  # `pnpm check` runs typecheck → lint → unit tests → build in that order,
  # stopping at the first failure.
  verify:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # No `version:` here on purpose. `packageManager` in package.json is
          # the single source of truth; specifying both makes pnpm/action-setup
          # fail with "Multiple versions of pnpm specified", which is exactly
          # how this workflow failed on its first run.
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      # Uploads the exported site so a failed step can be inspected by
      # downloading the artifact rather than by reproducing the build.
      - name: Upload exported site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: out/
          retention-days: 7

  # Runs against `out/` served by a static file server — the same artifact the
  # deploy target will serve. Testing `next dev` instead would tolerate a
  # request-time middleware or a missing static param that breaks in production.
  e2e:
    name: End-to-end (static export)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # No `version:` here on purpose. `packageManager` in package.json is
          # the single source of truth; specifying both makes pnpm/action-setup
          # fail with "Multiple versions of pnpm specified", which is exactly
          # how this workflow failed on its first run.
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No `pnpm build` here: playwright.config.ts runs the build inside
      # `webServer`, deliberately, so that a failed build can never leave E2E
      # testing a stale `out/`. Adding a build step would reintroduce exactly
      # that gap.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Separate job rather than a step: this catches the one class of i18n bug
  # that a passing build will not — a key added to en.json and forgotten in
  # bn.json. next-intl renders such a key as MISSING_MESSAGE in production
  # rather than throwing, so nothing else would notice.
  i18n:
    name: Translation parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # No `version:` here on purpose. `packageManager` in package.json is
          # the single source of truth; specifying both makes pnpm/action-setup
          # fail with "Multiple versions of pnpm specified", which is exactly
          # how this workflow failed on its first run.
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
