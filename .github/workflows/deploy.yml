name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queue rather than cancel, so a queued deploy is not
# silently dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # No `version:` here on purpose. `packageManager` in package.json is
          # the single source of truth; specifying both makes pnpm/action-setup
          # fail with "Multiple versions of pnpm specified", which is exactly
          # how this workflow failed on its first run.
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      # `wrangler-action` exposes the live URL as `deployment-url`; the old
      # `page_url` came from `upload-pages-artifact`, which this workflow no
      # longer uses.
      url: ${{ steps.deployment.outputs.deployment-url }}
    steps:
      # `cloudflare/pages-action` no longer exists. It was renamed to
      # `cloudflare/wrangler-action`, and the old name fails at "Unable to
      # resolve action" rather than with a useful message.
      #
      # The previous workflow also mixed `actions/upload-pages-artifact` — a
      # GitHub Pages concept — with a Cloudflare deploy job. Those are different
      # platforms; combined, the workflow could never have worked.
      - id: deployment
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=velox-web --branch=main
