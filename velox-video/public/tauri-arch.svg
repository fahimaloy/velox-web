<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Tauri Architecture Diagram -->
  <defs>
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fca311;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="webviewGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4c8bf5;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="cmdGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffbd2e;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:0.1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0A0E11"/>

  <!-- Title -->
  <text x="400" y="40" font-family="Inter, system-ui" font-size="24" font-weight="700" fill="#EDF2F3" text-anchor="middle">Tauri Architecture</text>
  <text x="400" y="70" font-family="Inter, system-ui" font-size="13" fill="#A8B4B9" text-anchor="middle">Rust Backend + WebView Frontend  •  ~10 MB</text>

  <!-- Rust Backend -->
  <rect x="80" y="100" width="640" height="120" rx="12" fill="url(#rustGrad)" stroke="#fca311" stroke-width="2" filter="url(#glow)"/>
  <text x="100" y="130" font-family="Inter, system-ui" font-size="16" font-weight="600" fill="#fca311">🦀  Rust Backend (Native)</text>
  <text x="100" y="160" font-family="Inter, system-ui" font-size="12" fill="#A8B4B9">Direct OS access — serial, Bluetooth, FS, networking, zero overhead</text>
  <text x="100" y="185" font-family="JetBrains Mono, monospace" font-size="11" fill="#ffbd2e">#[tauri::command]  async fn increment(state: State) -> i32</text>
  <text x="450" y="185" font-family="JetBrains Mono, monospace" font-size="11" fill="#A8B4B9">tokio • serde • zero-cost abstractions</text>

  <!-- WebView Frontend -->
  <rect x="80" y="240" width="640" height="100" rx="12" fill="url(#webviewGrad)" stroke="#4c8bf5" stroke-width="2"/>
  <text x="100" y="270" font-family="Inter, system-ui" font-size="16" font-weight="600" fill="#4c8bf5">🌐  WebView Frontend</text>
  <text x="100" y="300" font-family="Inter, system-ui" font-size="12" fill="#A8B4B9">Your Vue/React app — but runs in OS WebView (WebView2 / WebKitGTK / WKWebView)</text>
  <text x="100" y="325" font-family="JetBrains Mono, monospace" font-size="11" fill="#89ddff">import { invoke } from '@tauri-apps/api/core';  await invoke('increment')</text>

  <!-- Tauri Commands - The Gap -->
  <rect x="80" y="360" width="640" height="110" rx="12" fill="url(#cmdGrad)" stroke="#ffbd2e" stroke-width="2" filter="url(#glow)"/>
  <text x="100" y="390" font-family="Inter, system-ui" font-size="16" font-weight="600" fill="#ffbd2e">🟡  Tauri Commands (The Gap)</text>
  <text x="100" y="420" font-family="Inter, system-ui" font-size="12" fill="#A8B4B9">Better than Electron IPC, but still requires bridging:</text>
  <text x="120" y="445" font-family="Inter, system-ui" font-size="11" fill="#A8B4B9">• Type definitions duplicated (Rust ↔ TypeScript)</text>
  <text x="120" y="465" font-family="Inter, system-ui" font-size="11" fill="#A8B4B9">• Async serialization overhead (invoke → serialize → deserialize)</text>
  <text x="400" y="445" font-family="Inter, system-ui" font-size="11" fill="#A8B4B9">• WebView quirks per platform (WebView2 vs WebKitGTK vs WKWebView)</text>
  <text x="400" y="465" font-family="Inter, system-ui" font-size="11" fill="#A8B4B9">• No shared memory — everything crosses the bridge</text>
</svg>