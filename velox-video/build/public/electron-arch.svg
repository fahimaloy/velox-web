<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Electron Architecture Diagram -->
  <defs>
    <linearGradient id="chromiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4c8bf5;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6aa84f;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#4c7a2f;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6e66;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0a524e;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="ipcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a3342c;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#78261f;stop-opacity:0.1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0A0E11"/>

  <!-- Title -->
  <text x="400" y="40" font-family="Inter, system-ui" font-size="24" font-weight="700" fill="#EDF2F3" text-anchor="middle">Electron Architecture</text>
  <text x="400" y="70" font-family="Inter, system-ui" font-size="13" fill="#A8B4B9" text-anchor="middle">Chromium + Node.js + Your App  •  ~150 MB</text>

  <!-- Layer 1: Chromium -->
  <rect x="80" y="100" width="640" height="110" rx="12" fill="url(#chromiumGrad)" stroke="#4c8bf5" stroke-width="2" filter="url(#glow)"/>
  <text x="100" y="130" font-family="Inter, system-ui" font-size="16" font-weight="600" fill="#4c8bf5">🌐  Chromium Renderer Process (Blink + V8)</text>
  <text x="100" y="160" font-family="Inter, system-ui" font-size="12" fill="#A8B4B9">Full browser engine — DOM, CSS, JS, WebGL, WebRTC, DevTools, Extensions</text>
  <text x="100" y="185" font-family="JetBrains Mono, monospace" font-size="11" fill="#89ddff">Your Vue/React/Svelte app runs here — zero native access</text>

  <!-- Layer 2: Node.js -->
  <rect x="80" y="230" width="640" height="100" rx="12" fill="url(#nodeGrad)" stroke="#6aa84f" stroke-width="2"/>
  <text x="100" y="260" font-family="Inter, system-ui" font-size="16" font-weight="600" fill="#6aa84f">⚙️  Node.js Main Process</text>
  <text x="100" y="290" font-family="Inter, system-ui" font-size="12" fill="#A8B4B9">File system, native modules, child_process, full OS access — but isolated from renderer</text>

  <!-- Layer 3: Your App -->
  <rect x="80" y="350" width="640" height="80" rx="12" fill="url(#appGrad)" stroke="#0d6e66" stroke-width="2"/>
  <text x="100" y="380" font-family="Inter, system-ui" font-size="16" font-weight="600" fill="#2DD4BF">📦  Your App (Vue/React/Svelte)</text>
  <text x="100" y="405" font-family="Inter, system-ui" font-size="12" fill="#A8B4B9">Runs in renderer — zero native access without IPC bridge</text>

  <!-- IPC Bridge - The Problem -->
  <rect x="80" y="440" width="640" height="50" rx="12" fill="url(#ipcGrad)" stroke="#FF8A80" stroke-width="2" filter="url(#glow)"/>
  <text x="100" y="470" font-family="Inter, system-ui" font-size="14" font-weight="600" fill="#FF8A80">🔴  IPC Bridge (The Bottleneck)  —  preload.js + contextBridge + ipcMain/ipcRenderer</text>
  <text x="100" y="490" font-family="Inter, system-ui" font-size="11" fill="#FF8A80">Serial ports? ❌  Bluetooth? ❌  Native menus? ⚠️  System tray? ⚠️  Hardware accel? ⚠️</text>
</svg>